[tool.poetry]
name = "rolecanvas-agent"
version = "0.1.0"
description = "RoleCanvas FastAPI agent service: tools, chart-spec validation, jobs"
package-mode = false

[tool.poetry.dependencies]
python = "~3.12"
fastapi = "^0.165"
uvicorn = { version = "^0.35", extras = ["standard"] }
pydantic = "^2.11"
pydantic-settings = "^2.10"
httpx = "^0.28"
redis = "^7.0"
psycopg = { version = "^3.3", extras = ["binary"] }
jsonschema = "^4.25"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^1.0"
ruff = "^0.15"
mypy = "^1.15"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["\\.venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
